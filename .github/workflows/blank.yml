# ==========================================
# PC VIRTUAL GAMER - WINDOWS
# Sunshine + Tailscale + Conta de jogador
# ==========================================

$ErrorActionPreference = "Stop"

Write-Host "=== PC VIRTUAL GAMER ===" -ForegroundColor Cyan

# Verificar permissao de administrador
$principal = New-Object Security.Principal.WindowsPrincipal(
    [Security.Principal.WindowsIdentity]::GetCurrent()
)

if (-not $principal.IsInRole(
    [Security.Principal.WindowsBuiltInRole]::Administrator
)) {
    Write-Host "Execute o PowerShell como Administrador."
    exit 1
}

# Verificar winget
if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
    Write-Host "Instale o App Installer da Microsoft Store."
    exit 1
}

# Criar conta local do jogador
$nome = Read-Host "Nome da conta do jogador"

if ($nome -notmatch '^[a-zA-Z0-9_-]{3,20}$') {
    Write-Host "Use de 3 a 20 letras, numeros, _ ou -."
    exit 1
}

$conta = Get-LocalUser -Name $nome -ErrorAction SilentlyContinue

if (-not $conta) {
    $senha = Read-Host "Crie uma senha forte" -AsSecureString

    New-LocalUser `
        -Name $nome `
        -Password $senha `
        -FullName "Jogador" `
        -Description "Conta separada para jogos" | Out-Null

    Write-Host "Conta criada com sucesso!" -ForegroundColor Green
}
else {
    Write-Host "A conta ja existe."
}

# Instalar Sunshine
Write-Host "Instalando Sunshine..." -ForegroundColor Yellow

winget install `
    --id LizardByte.Sunshine `
    --exact `
    --accept-package-agreements `
    --accept-source-agreements

# Instalar Tailscale
Write-Host "Instalando Tailscale..." -ForegroundColor Yellow

winget install `
    --id Tailscale.Tailscale `
    --exact `
    --accept-package-agreements `
    --accept-source-agreements

# Mostrar informacoes do sistema
Write-Host "`n=== HARDWARE ===" -ForegroundColor Cyan

Get-CimInstance Win32_ComputerSystem |
    Select-Object Manufacturer, Model,
        @{Name="RAM_GB"; Expression={
            [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
        }}

Get-CimInstance Win32_Processor |
    Select-Object -First 1 Name

Get-CimInstance Win32_VideoController |
    Select-Object Name

# Mostrar espaco disponivel
Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
    Select-Object DeviceID,
        @{Name="Livre_GB"; Expression={
            [math]::Round($_.FreeSpace / 1GB, 2)
        }}

# Criar pasta do projeto
$pasta = "C:\PCVirtualGamer"

New-Item -Path $pasta -ItemType Directory -Force |
    Out-Null

# Criar informacoes do sistema
$info = @"
PC VIRTUAL GAMER
Data: $(Get-Date)
Computador: $env:COMPUTERNAME

Ferramentas:
- Sunshine: streaming de jogos
- Tailscale: rede privada
- Moonlight: cliente de streaming

Este script nao cria uma VM na nuvem.
Configure os aplicativos depois da instalacao.
"@

$info | Set-Content "$pasta\INFO.txt" -Encoding UTF8

# Finalizacao
Write-Host "`n=== CONFIGURACAO CONCLUIDA ===" -ForegroundColor Green

Write-Host "1. Configure o Tailscale."
Write-Host "2. Configure o Sunshine."
Write-Host "3. Instale Moonlight no dispositivo do jogador."
Write-Host "4. Conecte os dispositivos pela rede privada."
Write-Host "5. Instale jogos de fontes oficiais."
Write-Host "6. Teste a conexao e o desempenho."

Write-Host "`nIMPORTANTE:"
Write-Host "- A maquina virtual precisa existir previamente."
Write-Host "- Jogos 3D podem exigir GPU compativel."
Write-Host "- Nao exponha RDP/3389 diretamente a internet."
Write-Host "- Nunca publique senhas ou tokens no GitHub."
